<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERP Funilaria</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        background: #f6f7fb;
        color: #1f2937;
      }
      header {
        background: #111827;
        color: #fff;
        padding: 16px 24px;
      }
      header nav a {
        color: #fff;
        margin-right: 16px;
        text-decoration: none;
        font-weight: 600;
      }
      main {
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
      }
      form label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      form input,
      form select,
      form textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .btn {
        background: #2563eb;
        color: #fff;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      .muted {
        color: #6b7280;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/dashboard/">Dashboard</a>
        <a href="/ordens/nova/">Nova OS</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
