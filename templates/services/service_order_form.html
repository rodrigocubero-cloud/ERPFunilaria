{% extends "base.html" %}

{% block content %}
  <h1>Lançamento de Ordem de Serviço</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% for field in form.visible_fields %}
          <div>
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
              <div class="muted">{{ field.errors|striptags }}</div>
            {% endif %}
          </div>
        {% endfor %}
      </div>
      <div style="margin-top: 16px;">
        <button class="btn" type="submit">Salvar OS</button>
      </div>
    </form>
  </div>
{% endblock %}
